name: Farm CI

on:
  push:
    branches: [main]
    paths: ["farm/**", "uitheme/**", ".github/workflows/farm-ci.yml"]
  pull_request:
    paths: ["farm/**", "uitheme/**", ".github/workflows/farm-ci.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: farm
    steps:
      - uses: actions/checkout@v4

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          path: farm

      - name: Format check (StyLua)
        run: stylua --check src tests ../uitheme

      - name: Unit tests and compile check (Lune)
        run: lune run tests/run.luau

      - name: Build the place (Rojo)
        run: rojo build default.project.json -o farm-greybox.rbxlx
